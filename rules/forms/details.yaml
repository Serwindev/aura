    problem: {en: ["pus", "discharge", "swollen", "swelling", "sticky"], hi: ["मवाद", "सूजन", "कीचड़", "mawad", "mawad", "sujan", "soojan", "keechad", "kichad"]}
    match: {en: ["eyes", "eye discharge", "eyes pus"], hi: ["आँख", "आंख"]}
  nipple_problem:
    scope: visit
    type: yesno
    common_for: [HBNC]
    en: "Cracked nipples / painful or swollen breast?"
    hi: "फटे निप्पल / स्तन में दर्द या सूजन?"
    topic: {en: ["nipple", "nipples", "breast"], hi: ["निप्पल", "स्तन", "nipple", "stan"]}
    problem: {en: ["cracked", "pain", "painful", "swollen", "engorged", "sore"], hi: ["फटे", "फटा", "दर्द", "सूजन", "fate", "fata", "dard", "sujan"]}
    match: {en: ["cracked nipple", "nipple", "breast pain", "breastfeeding pain"], hi: ["निप्पल", "स्तन"]}
  mother_temp_f:
    scope: visit
    type: number
    unit: "°F"
    range: [90, 110]
    common_for: [HBNC, PNC]
    en: "Mother's temperature (°F)"
    hi: "माँ का तापमान (°F)"
    topic: {en: ["mother temperature", "mother's temperature", "mothers temperature", "temperature of mother"], hi: ["माँ का तापमान", "मां का तापमान", "maa ka tapman", "maa ka taapmaan", "maa ka temperature", "mummy ka temperature"]}
    match: {en: ["mother temperature", "mother s temperature", "mother temp"], hi: ["माँ का तापमान"]}
  mother_meals:
    scope: visit
