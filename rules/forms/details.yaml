# Extra details the official forms ask that a visit note does not usually contain (D-39).
# scope: visit  → stored on the note (record.extras.<id>)
#        person → stored on the person (sex, birth weight, RCH IDs): asked once, reused by every form
# type: yesno | number | text | choice. For yesno "problem" questions (eyes pus…), Yes = the problem is present.
# Voice: deterministic keyword rules (extraction/details.py). "topic" words find the clause; for problem questions
# a "problem" word (or an "it is fine" word) must be there too; a negation word ("nahin", "no") flips the answer.
# common_for: visit types whose review screen suggests it ("Forms also ask"). ADVISORY ONLY. status: draft.
version: 1
status: draft
source: "Questions taken from the forms in rules/forms/*.yaml [S35][S36][S39]; voice words written by the team (not reviewed)"
details:
  baby_alive:
    scope: visit
    type: yesno
    common_for: [HBNC]
    en: "Baby alive and at home?"
    hi: "बच्चा जीवित और घर पर?"
    topic: {en: ["alive", "available", "at home"], hi: ["जीवित", "ज़िंदा", "जिंदा", "zinda", "jivit", "घर पर", "ghar par"]}
    match: {en: ["baby alive", "alive", "available"], hi: ["जीवित"]}
  exclusive_bf:
    scope: visit
    type: yesno
    common_for: [HBNC]
    en: "Only breastfed (exclusive breastfeeding)?"
    hi: "सिर्फ़ माँ का दूध (केवल स्तनपान)?"
    topic: {en: ["exclusive breastfeeding", "exclusively breastfed", "only breast milk", "only breastfed", "only breastfeeding"], hi: ["सिर्फ़ माँ का दूध", "सिर्फ माँ का दूध", "केवल माँ का दूध", "केवल स्तनपान", "sirf maa ka doodh", "sirf maa ka dudh", "keval stanpan", "ऊपर का दूध", "upar ka doodh"]}
    invert_words: ["ऊपर का दूध", "upar ka doodh"]   # "upar ka doodh diya" (formula/top feed) = not exclusive
    match: {en: ["exclusive breastfeeding", "exclusive", "only breast milk"], hi: ["केवल स्तनपान", "सिर्फ़ माँ का दूध"]}
  kept_warm:
    scope: visit
    type: yesno
    common_for: [HBNC]
    en: "Baby kept warm?"
    hi: "बच्चे को गर्म रखा?"
    topic: {en: ["warm", "wrapped"], hi: ["गर्म", "गरम", "garam", "lapet", "लपेट", "ढक", "dhak"]}
    match: {en: ["kept warm", "warm"], hi: ["गर्म"]}
  eyes_pus:
