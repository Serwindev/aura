    problem: {en: ["less", "low", "all the time", "continuously"], hi: ["कम", "kam", "लगातार", "lagatar"]}
    match: {en: ["urine", "crying incessantly"], hi: ["पेशाब"]}
  milk_less:
    scope: visit
    type: yesno
    en: "No milk, or mother feels milk is less?"
    hi: "दूध नहीं या कम लगता है?"
    topic: {en: ["milk"], hi: ["दूध", "doodh", "dudh"]}
    problem: {en: ["less", "not enough", "no milk", "low"], hi: ["कम", "kam", "नहीं आ रहा", "nahi aa raha"]}
    match: {en: ["milk is less", "no milk", "milk less"], hi: ["दूध कम"]}
  mother_referred:
