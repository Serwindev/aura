    hi: "माँ 24 घंटे में कितनी बार पूरा खाना खाती है"
    topic: {en: ["meal", "meals"], hi: ["खाना", "भोजन", "khana", "bhojan"]}
    match: {en: ["meals", "full meal"], hi: ["खाना", "भोजन"]}
  urine_low:
    scope: visit
    type: yesno
    en: "Cries all the time or passes urine less than 6 times a day?"
