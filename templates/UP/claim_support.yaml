id: up_claim_support
version: 1
status: national_rates_unconfirmed_for_up
source: "[S17] context.md §8.5"
rates:
  hbnc_series: 250   # one payment per newborn for the full 6/7-visit series
  hbyc_visit: 50     # per visit, 5 visits (₹250 per child)
# HBNC payment conditions [S17]: mother and newborn safe to day 42; birth registered. She confirms both on the
