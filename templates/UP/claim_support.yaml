# Incentive CLAIM SUPPORT sheet. Prepares a claim; it does not file or replace one.
# Verification and payment stay with the ANM/Sangini and BCPM-MIS.
id: up_claim_support
version: 1
status: national_rates_unconfirmed_for_up
source: "[S17] context.md §8.5"
rates:
  hbnc_series: 250   # one payment per newborn for the full 6/7-visit series
  hbyc_visit: 50     # per visit, 5 visits (₹250 per child)
hbnc_conditions:
  en: "ANM to verify: mother and newborn safe to day 42; birth registered"
  hi: "ANM जाँच करें: 42वें दिन तक माँ और शिशु सुरक्षित; जन्म पंजीकृत"
not_computed:
  en: "Not included: immunisation session mobilisation, monthly lists, Anaemia Mukt Bharat. These are not derived from visit notes."
  hi: "शामिल नहीं: टीकाकरण सत्र मोबिलाइज़ेशन, मासिक सूचियाँ, एनीमिया मुक्त भारत। ये भ्रमण नोट से नहीं बनते।"
warning:
  en: "National rates — confirm UP rates. Estimate only; verification and payment stay with ANM/Sangini and BCPM-MIS."
  hi: "राष्ट्रीय दरें — UP की दरें पुष्टि करें। केवल अनुमान; सत्यापन और भुगतान ANM/संगिनी और BCPM-MIS से ही होगा।"
