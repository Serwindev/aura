[project]
name = "aura-server"
version = "0.1.0"
description = "A.U.R.A. server: voice note -> verified structured record (synthetic data only)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1.8",
    "uharfbuzz>=0.57.0",
    "uvicorn[standard]>=0.54.0",
    "vosk>=0.3.45",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long Hindi lexicon lines are fine

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]  # FastAPI's Depends()/File() defaults are the documented pattern

[tool.uv]
package = false
