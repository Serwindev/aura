name: ci
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists the PR's commits; without this it fails with 403

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: make setup
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Privacy audit (contract checks)
        run: python scripts/privacy_audit.py --out /tmp/privacy-audit.md
      - name: Secret scan (local script)
        run: python scripts/secret_scan.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    # Android app (mobile/): JVM tests for the autofill rules + debug APK. The runner image has the Android SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: mobile
        run: |
          npm ci
          node copy-web.mjs
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
